# Nginx untuk PO System.
# Salin ke /etc/nginx/sites-available/po-system, ganti po.contoh.co.id dengan domain Anda,
# lalu: ln -s /etc/nginx/sites-available/po-system /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Sertifikat HTTPS: certbot --nginx -d po.contoh.co.id (certbot menambah blok listen 443 otomatis).

limit_req_zone $binary_remote_addr zone=po_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name po.contoh.co.id;

    root /var/www/po-system/frontend/dist;
    index index.html;

    # Upload bukti maks 2 MB, impor Excel maks 5 MB
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Batasi percobaan login (lapisan kedua selain rate limit di aplikasi)
    location = /api/auth/login {
        limit_req zone=po_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    # Aset hasil build Vite memakai nama ber-hash: aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: semua rute lain diarahkan ke index.html (jangan di-cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
